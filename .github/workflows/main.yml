name: Build Phantom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Show files
        shell: cmd
        run: dir PhantomExec /s

      - name: Restore
        run: nuget restore PhantomExec/Phantom.sln

      - name: Build
        run: msbuild PhantomExec/Phantom.sln /p:Configuration=Release /p:Platform=x64 /verbosity:normal

      - name: Find EXEs
        shell: cmd
        run: dir /s *.exe

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PhantomEXE
          path: "**/*.exe"
